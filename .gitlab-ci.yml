stages:
  - build
  - test

build-server:
  stage: build
  image: ubuntu:22.04
  before_script:
    - apt-get update && apt-get install -y cmake g++ ninja-build git
  script:
    - cmake -S . -B build -G Ninja -DSLASHCO_ENABLE_RAYLIB=OFF -DCMAKE_BUILD_TYPE=Release
    - cmake --build build
  artifacts:
    paths:
      - build/SlashCoServer
      - build/config.ini

selftest:
  stage: test
  needs:
    - build-server
  script:
    - ./build/SlashCoServer --selftest 3 | tee selftest.log
    - grep -q "\[SELFTEST\] PASS" selftest.log
